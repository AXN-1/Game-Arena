<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
  body {
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  h1 { margin: 10px; }
  #game-board {
    position: relative;
    width: 400px;
    height: 400px;
    background: repeating-linear-gradient(
      45deg,
      #111,
      #111 20px,
      #222 20px,
      #222 40px
    );
    border: 2px solid #fff;
    display: grid;
    grid-template-columns: repeat(20, 20px);
    grid-template-rows: repeat(20, 20px);
  }
  .cell { width: 20px; height: 20px; }
  .snake {
    background: linear-gradient(to bottom, lime, green);
    border-radius: 5px;
    transition: all 0.15s linear;
  }
  .snake-head {
    background: lime;
    border-radius: 50%;
    position: relative;
  }
  .snake-head::before {
    content: "👀";
    position: absolute;
    top: -5px;
    left: -5px;
    font-size: 14px;
  }
  .food {
    background: radial-gradient(circle, red, darkred);
    border-radius: 50%;
    box-shadow: 0 0 10px red;
  }
  #status { margin: 10px; font-size: 18px; }
  #scoreboard { margin: 10px; font-size: 18px; }
  .controls { margin-top: 10px; }
  button {
    padding: 10px 20px;
    margin: 5px;
    font-size: 16px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  #restartBtn { background: lime; }
  #pauseBtn { background: orange; }
  #backBtn { background: red; color: #fff; }
  button:hover { opacity: 0.8; }
  #congrats, #gameover {
    position: fixed;
    top: 40%;
    font-size: 50px;
    font-weight: bold;
    display: none;
    text-align: center;
  }
  #congrats {
    color: gold;
    text-shadow: 0 0 20px #fff, 0 0 40px gold;
    animation: glowText 2s infinite alternate, bounceText 1s infinite;
  }
  #gameover {
    color: red;
    text-shadow: 0 0 20px #fff, 0 0 40px red;
    animation: shakeBoard 0.5s infinite;
  }
  @keyframes glowText { from { opacity: 0.8; } to { opacity: 1; } }
  @keyframes bounceText { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
  @keyframes shakeBoard {
    0% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    50% { transform: translateX(10px); }
    75% { transform: translateX(-10px); }
    100% { transform: translateX(0); }
  }
</style>
</head>
<body>
<h1>Snake Game</h1>
<div id="game-board"></div>
<div id="status">Use arrow keys to play!</div>
<div id="scoreboard">Score: 0 | High Score: 0</div>
<div class="controls">
  <button id="restartBtn">Restart</button>
  <button id="pauseBtn">Pause</button>
  <button id="backBtn">Back</button>
</div>
<div id="congrats">🎉 Congratulations! You Won 🎉</div>
<div id="gameover">💀 Game Over 💀</div>

<script>
const board = document.getElementById("game-board");
const statusEl = document.getElementById("status");
const congratsEl = document.getElementById("congrats");
const gameoverEl = document.getElementById("gameover");
const restartBtn = document.getElementById("restartBtn");
const pauseBtn = document.getElementById("pauseBtn");
const backBtn = document.getElementById("backBtn");
const scoreboard = document.getElementById("scoreboard");

let snake = [{x:10,y:10}];
let food = {x:5,y:5};
let dx = 1, dy = 0;
let gameInterval;
let paused = false;
let score = 0;
let highScore = localStorage.getItem("snakeHighScore") || 0;
let speed = 200;

function updateScore(){
  scoreboard.textContent = `Score: ${score} | High Score: ${highScore}`;
}

function drawBoard(){
  board.innerHTML="";
  snake.forEach((part,i)=>{
    const cell=document.createElement("div");
    cell.classList.add("cell","snake");
    if(i===0) cell.classList.add("snake-head");
    cell.style.gridColumn=part.x;
    cell.style.gridRow=part.y;
    board.appendChild(cell);
  });
  const foodCell=document.createElement("div");
  foodCell.classList.add("cell","food");
  foodCell.style.gridColumn=food.x;
  foodCell.style.gridRow=food.y;
  board.appendChild(foodCell);
}

function moveSnake(){
  if(paused) return;
  const head={x:snake[0].x+dx,y:snake[0].y+dy};
  if(head.x<1||head.x>20||head.y<1||head.y>20||snake.some(p=>p.x===head.x&&p.y===head.y)){
    endGame();
    return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score++;
    if(score>highScore){
      highScore=score;
      localStorage.setItem("snakeHighScore",highScore);
    }
    updateScore();
    food={x:Math.floor(Math.random()*20)+1,y:Math.floor(Math.random()*20)+1};
    // speed increase
    clearInterval(gameInterval);
    speed = Math.max(50, speed-5);
    gameInterval=setInterval(moveSnake,speed);
  } else {
    snake.pop();
  }
  drawBoard();
}

function endGame(){
  clearInterval(gameInterval);
  gameoverEl.style.display="block";
}

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowUp"&&dy===0){dx=0;dy=-1;}
  else if(e.key==="ArrowDown"&&dy===0){dx=0;dy=1;}
  else if(e.key==="ArrowLeft"&&dx===0){dx=-1;dy=0;}
  else if(e.key==="ArrowRight"&&dx===0){dx=1;dy=0;}
});

function startGame(){
  snake=[{x:10,y:10}];
  dx=1;dy=0;
  food={x:5,y:5};
  score=0;
  speed=200;
  congratsEl.style.display="none";
  gameoverEl.style.display="none";
  updateScore();
  drawBoard();
  clearInterval(gameInterval);
  gameInterval=setInterval(moveSnake,speed);
}

restartBtn.addEventListener("click",startGame);
pauseBtn.addEventListener("click",()=>{
  paused=!paused;
  pauseBtn.textContent=paused?"Resume":"Pause";
});
backBtn.addEventListener("click",()=>{
  window.location.href="index.html"; // apne home page ka naam daalo
});

startGame();
</script>
</body>
</html>
