<!DOCTYPE html>
<html>
<head>
<title>Breakout Game</title>
<style>
  body { background:#111; font-family:Arial, sans-serif; text-align:center; }
  canvas { background:linear-gradient(to bottom,#222,#000); display:block; margin:20px auto; border:3px solid #444; border-radius:10px; }
  button {
    margin:8px; padding:12px 20px;
    border:none; border-radius:8px;
    background:linear-gradient(270deg,#06f,#0ff,#06f);
    background-size:400% 400%;
    color:white; font-size:16px; font-weight:bold;
    cursor:pointer; transition:0.3s;
    animation:gradientShift 6s ease infinite;
  }
  button:hover { box-shadow:0 0 15px #0ff; transform:scale(1.05); }
  @keyframes gradientShift {
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
</style>
</head>
<body>
<canvas id="breakout" width="480" height="320"></canvas>
<div>
  <button onclick="startGame()">Start</button>
  <button onclick="restartGame()">Restart</button>
  <button onclick="pauseGame()">Pause</button>
  <button onclick="goBack()">Back</button>
</div>
<script>
let canvas=document.getElementById("breakout"),ctx=canvas.getContext("2d");
let ballX,ballY,dx,dy,paddleX,bricks,score,lives,gameInterval,level,ballSpeed;
let paused=false;

function init(){
  ballSpeed=2;
  ballX=Math.random()*(canvas.width-40)+20;
  ballY=canvas.height-30;
  dx=(Math.random()<0.5?-ballSpeed:ballSpeed);
  dy=-ballSpeed;
  paddleX=(canvas.width-75)/2;
  score=0;
  lives=3;
  level=1;
  generateBricks();
}

function generateBricks(){
  let cols=3+level; 
  let rows=2+level; 
  bricks=[];
  for(let c=0;c<cols;c++){
    bricks[c]=[];
    for(let r=0;r<rows;r++){
      bricks[c][r]={x:0,y:0,status:1,color:randomColor()};
    }
  }
}

function randomColor(){
  let colors=["red","orange","lime","cyan","magenta","yellow"];
  return colors[Math.floor(Math.random()*colors.length)];
}

function drawBall(){
  let gradient=ctx.createRadialGradient(ballX-5,ballY-5,5,ballX,ballY,10);
  gradient.addColorStop(0,"white");
  gradient.addColorStop(0.5,"lime");
  gradient.addColorStop(1,"green");
  ctx.fillStyle=gradient;
  ctx.shadowColor="lime";
  ctx.shadowBlur=15;
  ctx.beginPath();
  ctx.arc(ballX,ballY,10,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;
}

function drawPaddle(){
  ctx.fillStyle="cyan";
  ctx.shadowColor="cyan";
  ctx.shadowBlur=20;
  ctx.fillRect(paddleX,canvas.height-10,75,10);
  ctx.shadowBlur=0;
}

function drawBricks(){
  for(let c=0;c<bricks.length;c++){
    for(let r=0;r<bricks[c].length;r++){
      if(bricks[c][r].status){
        let bx=c*70+30,by=r*20+30;
        bricks[c][r].x=bx;bricks[c][r].y=by;
        let gradient=ctx.createLinearGradient(bx,by,bx+60,by+20);
        gradient.addColorStop(0,bricks[c][r].color);
        gradient.addColorStop(1,"black");
        ctx.fillStyle=gradient;
        ctx.shadowColor=bricks[c][r].color;
        ctx.shadowBlur=10;
        ctx.fillRect(bx,by,60,20);
        ctx.shadowBlur=0;
      }
    }
  }
}

function collision(){
  for(let c=0;c<bricks.length;c++){
    for(let r=0;r<bricks[c].length;r++){
      let b=bricks[c][r];
      if(b.status){
        if(ballX>b.x&&ballX<b.x+60&&ballY>b.y&&ballY<b.y+20){
          dy=-dy;
          b.status=0;
          score++;
          if(score==bricks.length*bricks[0].length){
            nextLevel();
          }
        }
      }
    }
  }
}

function draw(){
  if(paused) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBall();drawPaddle();drawBricks();collision();
  ballX+=dx;ballY+=dy;

  if(ballX+dx>canvas.width-10||ballX+dx<10)dx=-dx;
  if(ballY+dy<10)dy=-dy;
  else if(ballY+dy>canvas.height-10){
    if(ballX>paddleX&&ballX<paddleX+75)dy=-dy;
    else{
      lives--;
      if(lives<=0){
        showMessage("GAME OVER! Final Level: "+level);
        clearInterval(gameInterval);
      } else {
        ballX=Math.random()*(canvas.width-40)+20;
        ballY=canvas.height-30;
        dx=(Math.random()<0.5?-ballSpeed:ballSpeed);
        dy=-ballSpeed;
      }
    }
  }

  ctx.fillStyle="white";
  ctx.font="16px Arial";
  ctx.fillText("Score: "+score,8,20);
  ctx.fillText("Lives: "+lives,canvas.width-80,20);
  ctx.fillText("Level: "+level,200,20);
}

document.addEventListener("mousemove",e=>{
  let relX=e.clientX-canvas.offsetLeft;
  if(relX>0&&relX<canvas.width)paddleX=relX-75/2;
});

function showMessage(msg){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="yellow";
  ctx.shadowColor="yellow";
  ctx.shadowBlur=15;
  ctx.font="28px Arial Black";
  ctx.fillText(msg,50,canvas.height/2);
  ctx.shadowBlur=0;
}

function nextLevel(){
  level++;
  if(level>3){
    showMessage("🎉 YOU WIN ALL LEVELS 🎉");
    clearInterval(gameInterval);
  } else {
    clearInterval(gameInterval);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="lime";
    ctx.font="24px Arial";
    ctx.fillText("Level " + (level-1) + " Complete!", 120, canvas.height/2 - 40);
    ctx.fillText("Do you want to continue?", 100, canvas.height/2);

    let nextBtn=document.createElement("button");
    nextBtn.innerText="Next Level";
    nextBtn.style.margin="10px";
    nextBtn.onclick=function(){
      ballSpeed += 0.5;  
      ballX=Math.random()*(canvas.width-40)+20;
      ballY=canvas.height-30;
      dx=(Math.random()<0.5?-ballSpeed:ballSpeed);
      dy=-ballSpeed;
      score=0;
      generateBricks();
      clearInterval(gameInterval);
      gameInterval=setInterval(draw,10);
      nextBtn.remove();
      backBtn.remove();
    };

    let backBtn=document.createElement("button");
    backBtn.innerText="Back";
    backBtn.style.margin="10px";
    backBtn.onclick=function(){
      window.location.href="index.html";
    };

    document.body.appendChild(nextBtn);
    document.body.appendChild(backBtn);
  }
}

function startGame(){init();clearInterval(gameInterval);gameInterval=setInterval(draw,10);}
function restartGame(){startGame();}
function pauseGame(){paused=!paused;}
function goBack(){window.location.href="index.html";}
</script>
</body>
</html>
