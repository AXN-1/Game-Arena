<!DOCTYPE html>
<html>
<head>
<title>Sliding Puzzle</title>
<style>
  canvas { background:#222; display:block; margin:20px auto; }
</style>
</head>
<body>
<canvas id="puzzle" width="400" height="400"></canvas>
<script>
let canvas=document.getElementById("puzzle"),ctx=canvas.getContext("2d");
let size=4, tiles=[], empty={x:3,y:3};

function init(){
  tiles=[];
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      if(x==3&&y==3) continue;
      tiles.push({x,y,num:y*size+x+1});
    }
  }
  draw();
}

function draw(){
  ctx.clearRect(0,0,400,400);
  tiles.forEach(t=>{
    ctx.fillStyle="#0ff";
    ctx.fillRect(t.x*100,t.y*100,100,100);
    ctx.fillStyle="black";
    ctx.font="40px Arial";
    ctx.fillText(t.num,t.x*100+35,t.y*100+60);
  });
}

canvas.addEventListener("click",e=>{
  let rect=canvas.getBoundingClientRect();
  let x=Math.floor((e.clientX-rect.left)/100);
  let y=Math.floor((e.clientY-rect.top)/100);
  let tile=tiles.find(t=>t.x==x&&t.y==y);
  if(tile && (Math.abs(tile.x-empty.x)+Math.abs(tile.y-empty.y)==1)){
    [tile.x,tile.y,empty.x,empty.y]=[empty.x,empty.y,tile.x,tile.y];
    draw();
  }
});

init();
</script>
</body>
</html>
