<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Memory Match</title>
<style>
  body {
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    padding: 20px;
  }
  h1 { margin-bottom: 10px; }
  #controls { margin: 10px; }
  button {
    padding: 8px 15px;
    margin: 5px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  #game-board {
    display: grid;
    gap: 10px;
    margin-top: 20px;
  }
  .card {
    width: 80px;
    height: 80px;
    perspective: 600px;
  }
  .card-inner {
    width: 100%;
    height: 100%;
    transition: transform 0.6s;
    transform-style: preserve-3d;
    cursor: pointer;
    position: relative;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .card-front, .card-back {
    position: absolute;
    width: 100%; height: 100%;
    backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem;
    border: 2px solid #fff;
    border-radius: 10px;
  }
  .card-front { background: #111; }
  .card-back { background: #222; transform: rotateY(180deg); }
  .match { animation: matchAnim 0.6s ease; border: 2px solid lime; }
  @keyframes matchAnim { 0%{transform:scale(1);}50%{transform:scale(1.2);}100%{transform:scale(1);} }
  .mismatch { animation: shake 0.4s; border: 2px solid red; }
  @keyframes shake {0%{transform:translateX(0);}25%{transform:translateX(-5px);}50%{transform:translateX(5px);}75%{transform:translateX(-5px);}100%{transform:translateX(0);} }
  #status, #scoreboard, #timer { margin-top: 10px; font-size: 18px; }
  #modal {
    position: fixed; top: 40%; background: #111; padding: 20px;
    border: 2px solid #fff; border-radius: 10px; display: none;
    text-align: center;
  }
</style>
</head>
<body>
<h1>Memory Match</h1>
<div id="controls">
  <button onclick="startGame(4)">Easy</button>
  <button onclick="startGame(6)">Medium</button>
  <button onclick="startGame(8)">Hard</button>
  <button onclick="restartGame()">Restart</button>
  <button onclick="goBack()">Back</button>
</div>
<div id="status">Choose difficulty to start!</div>
<div id="scoreboard">Score: 0 | High Score: 0</div>
<div id="timer">Time: 60</div>
<div id="game-board"></div>
<div id="modal">
  <h2 id="modal-text"></h2>
  <button onclick="restartGame()">Play Again</button>
</div>

<script>
let board=document.getElementById("game-board");
let statusEl=document.getElementById("status");
let scoreboard=document.getElementById("scoreboard");
let timerEl=document.getElementById("timer");
let modal=document.getElementById("modal");
let modalText=document.getElementById("modal-text");

let flippedCards=[],matchedCount=0,score=0,highScore=localStorage.getItem("mmHighScore")||0;
let timer, timeLeft=60, size=4, symbols=[],gameActive=false;

function updateScore(){scoreboard.textContent=`Score: ${score} | High Score: ${highScore}`;}
function updateTimer(){timerEl.textContent=`Time: ${timeLeft}`;}

function resetGame(){
  clearInterval(timer);
  flippedCards=[]; matchedCount=0; score=0; timeLeft=60;
  updateScore(); updateTimer();
  modal.style.display="none";
}

function startGame(n){
  size=n; resetGame();
  let total=(n*n)/2;
  symbols=["🍎","🍌","🍇","🍒","🍓","🍍","🥝","🍑","🍉","🥥","🍋","🍐","🍊","🥭","🍈","🍏"];
  let deck=[...symbols.slice(0,total),...symbols.slice(0,total)];
  deck.sort(()=>Math.random()-0.5);
  board.style.gridTemplateColumns=`repeat(${n},80px)`;
  board.innerHTML="";
  deck.forEach(sym=>{
    let card=document.createElement("div");
    card.classList.add("card");
    card.dataset.symbol=sym;
    let inner=document.createElement("div");
    inner.classList.add("card-inner");
    let front=document.createElement("div");
    front.classList.add("card-front");
    front.textContent="?";
    let back=document.createElement("div");
    back.classList.add("card-back");
    back.textContent=sym;
    inner.appendChild(front);inner.appendChild(back);
    card.appendChild(inner);
    card.addEventListener("click",flipCard);
    board.appendChild(card);
  });
  gameActive=true;
  timer=setInterval(()=>{if(gameActive){timeLeft--;updateTimer();if(timeLeft<=0){endGame(false);}}},1000);
}

function flipCard(e){
  if(!gameActive) return;
  let card=e.currentTarget;
  if(card.classList.contains("flipped")||flippedCards.length===2) return;
  card.classList.add("flipped");
  flippedCards.push(card);
  if(flippedCards.length===2) setTimeout(checkMatch,800);
}

function checkMatch(){
  let [c1,c2]=flippedCards;
  if(c1.dataset.symbol===c2.dataset.symbol){
    matchedCount++;score+=10;
    c1.classList.add("match");c2.classList.add("match");
    if(matchedCount===(size*size)/2) endGame(true);
  } else {
    c1.classList.add("mismatch");c2.classList.add("mismatch");
    setTimeout(()=>{c1.classList.remove("flipped","mismatch");c2.classList.remove("flipped","mismatch");},600);
  }
  flippedCards=[]; updateScore();
}

function endGame(win){
  gameActive=false; clearInterval(timer);
  if(win){
    statusEl.textContent="🎉 You Won!";
    if(score>highScore){highScore=score;localStorage.setItem("mmHighScore",highScore);}
    modalText.textContent=`You Won! Score: ${score}`;
  } else {
    statusEl.textContent="⏰ Time's Up!";
    modalText.textContent=`Game Over! Score: ${score}`;
  }
  modal.style.display="block";
}

function restartGame(){ startGame(size); }

function goBack(){
  window.location.href="index.html"; // apne home page ka path daalo
}

updateScore();
</script>
</body>
</html>
