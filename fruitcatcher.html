<!DOCTYPE html>
<html>
<head>
<title>Breakout Game</title>
<style>
  canvas { background:#111; display:block; margin:20px auto; }
  button { margin:5px; padding:10px; }
</style>
</head>
<body>
<canvas id="breakout" width="480" height="320"></canvas>
<div>
  <button onclick="startGame()">Start</button>
  <button onclick="restartGame()">Restart</button>
  <button onclick="goBack()">Back</button>
</div>
<script>
let canvas=document.getElementById("breakout"),ctx=canvas.getContext("2d");
let ballX,ballY,dx,dy,paddleX,bricks,score,lives,gameInterval,level;

function init(){
  ballX=Math.random()*(canvas.width-40)+20;
  ballY=canvas.height-30;
  dx=(Math.random()<0.5?-2:2);
  dy=-2;
  paddleX=(canvas.width-75)/2;
  score=0;
  lives=3;
  level=1;
  generateBricks();
}

function generateBricks(){
  let cols=3+level; 
  let rows=2+level; 
  bricks=[];
  for(let c=0;c<cols;c++){
    bricks[c]=[];
    for(let r=0;r<rows;r++){
      bricks[c][r]={x:0,y:0,status:1,color:randomColor()};
    }
  }
}

function randomColor(){
  let colors=["red","orange","lime","cyan","magenta","yellow"];
  return colors[Math.floor(Math.random()*colors.length)];
}

function drawBall(){ctx.beginPath();ctx.arc(ballX,ballY,10,0,Math.PI*2);ctx.fillStyle="lime";ctx.fill();ctx.closePath();}
function drawPaddle(){ctx.fillStyle="blue";ctx.fillRect(paddleX,canvas.height-10,75,10);}
function drawBricks(){
  for(let c=0;c<bricks.length;c++){
    for(let r=0;r<bricks[c].length;r++){
      if(bricks[c][r].status){
        let bx=c*70+30,by=r*20+30;
        bricks[c][r].x=bx;bricks[c][r].y=by;
        ctx.fillStyle=bricks[c][r].color;
        ctx.fillRect(bx,by,60,20);
      }
    }
  }
}

function collision(){
  for(let c=0;c<bricks.length;c++){
    for(let r=0;r<bricks[c].length;r++){
      let b=bricks[c][r];
      if(b.status){
        if(ballX>b.x&&ballX<b.x+60&&ballY>b.y&&ballY<b.y+20){
          dy=-dy;
          b.status=0;
          score++;
          if(score==bricks.length*bricks[0].length){
            nextLevel();
          }
        }
      }
    }
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBall();drawPaddle();drawBricks();collision();
  ballX+=dx;ballY+=dy;

  if(ballX+dx>canvas.width-10||ballX+dx<10)dx=-dx;
  if(ballY+dy<10)dy=-dy;
  else if(ballY+dy>canvas.height-10){
    if(ballX>paddleX&&ballX<paddleX+75)dy=-dy;
    else{
      lives--;
      if(lives<=0){
        showMessage("GAME OVER! Final Level: "+level);
        clearInterval(gameInterval);
      } else {
        ballX=Math.random()*(canvas.width-40)+20;
        ballY=canvas.height-30;
        dx=(Math.random()<0.5?-2:2);
        dy=-2;
      }
    }
  }

  ctx.fillStyle="white";
  ctx.font="16px Arial";
  ctx.fillText("Score: "+score,8,20);
  ctx.fillText("Lives: "+lives,canvas.width-80,20);
  ctx.fillText("Level: "+level,200,20);
}

document.addEventListener("mousemove",e=>{
  let relX=e.clientX-canvas.offsetLeft;
  if(relX>0&&relX<canvas.width)paddleX=relX-75/2;
});

function showMessage(msg){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="yellow";
  ctx.font="28px Arial";
  ctx.fillText(msg,50,canvas.height/2);
}

function nextLevel(){
  level++;
  if(level>3){
    showMessage("🎉 YOU WIN ALL LEVELS 🎉");
    clearInterval(gameInterval);
  } else {
    showMessage("Level Complete! Starting Level "+level+"...");
    setTimeout(()=>{
      ballX=Math.random()*(canvas.width-40)+20;
      ballY=canvas.height-30;
      dx=(Math.random()<0.5?-2:2);
      dy=-2-level; 
      score=0;
      generateBricks();
    },1500);
  }
}

function startGame(){init();clearInterval(gameInterval);gameInterval=setInterval(draw,10);}
function restartGame(){startGame();}
function goBack(){window.location.href="index.html";}
</script>
</body>
</html>
